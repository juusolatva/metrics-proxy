# LLM Metrics Proxy configuration
#
# Read from ./config.yaml by default; use --config <file> to load another file,
# e.g. one per upstream server.

# Port the proxy server listens on (default: 8080)
proxy_port: 8080

# Upstream LLM server: LM Studio, Ollama or any OpenAI-compatible HTTP server.
# The key is named "lm_studio" for backward compatibility, whatever the server.
lm_studio:
  # Host and port of the server (default: localhost:1234, LM Studio's default).
  # For Ollama use port 11434 and enable "/api/*" below.
  host: "localhost"
  port: 1234

# Request paths forwarded to the upstream; all other paths get 404.
# Patterns are path prefixes; a trailing "*" is optional.
api_endpoints:
  - "/api/v1/*"  # LM Studio native REST API
  - "/v1/*"      # OpenAI-compatible API (LM Studio, Ollama, others)
  # - "/api/*"   # Ollama native API (/api/chat, /api/generate)

# Metrics settings
metrics:
  # Number of recent queries to average tokens/sec over (default: 10)
  history_points: 10

# Logging settings
logging:
  # Print [DEBUG] lines: effective config, backend probe, and per request the
  # upstream status, Content-Type, parser used and how metrics were derived.
  debug: false
