# LLM Metrics Proxy configuration
#
# Read from ./config.yaml by default; use --config <file> to load another file,
# e.g. one per upstream server.
#
# Metrics inspection has fixed limits (not YAML options): 16 MiB per capture,
# eight result/response wrapper hops and 32 MiB cumulative decoding per JSON
# body, SSE event or NDJSON line. Over-limit wrappers are ignored for metrics;
# response forwarding continues unchanged. --csv text cells are protected
# against formula interpretation with a leading apostrophe when needed.

# Port the proxy server listens on (default: 11436, next to Ollama's 11434 and
# a second instance's 11435; earlier versions used 8080)
proxy_port: 11436

# Upstream LLM server: LM Studio, Ollama or any OpenAI-compatible HTTP server.
# (Called "lm_studio" in earlier versions.)
server:
  # Host and port of the server (default: localhost:1234, LM Studio's default).
  # For Ollama use port 11434 and enable "/api/*" below.
  host: "localhost"
  port: 1234

# Request paths whose responses are metered. Patterns are path prefixes; a
# trailing "*" is optional.
api_endpoints:
  - "/api/v1/*"  # LM Studio native REST API
  - "/v1/*"      # OpenAI-compatible API (LM Studio, Ollama, others)
  # - "/api/*"   # Ollama native API (/api/chat, /api/generate)

# Forward requests to other paths (e.g. /api/tags, /models) to the upstream
# unmetered, so clients get the upstream's own answer (default: true).
# false answers them with 404 without forwarding.
forward_unmatched: true

# Forward requests that manage the server instead of querying it (default:
# false). The proxy has no authentication, so anyone who can reach it could
# otherwise use them even when the server itself only listens on localhost.
# While false, these are answered with 403 without forwarding, even when they
# match api_endpoints:
# - Ollama: /api/pull, /api/push, /api/create, /api/copy, /api/delete,
#   /api/blobs, and the ollama.com account endpoints /api/me, /api/signout,
#   /api/user/keys. Queries that use the account (cloud models, /api/web_search,
#   /api/web_fetch) are forwarded like other queries.
# - LM Studio: /api/v1/models/load, /api/v1/models/unload,
#   /api/v1/models/download.
# - WebSocket and other protocol upgrades on any path, as used by LM Studio's
#   SDK (lmstudio-js, lmstudio-python): set true to use the SDK through the
#   proxy. An "Upgrade: h2c" offer (sent by Java's HttpClient) is dropped and
#   the request forwarded as plain HTTP/1.1.
forward_management: false

# Host names clients may use for the proxy (the request's Host header). IP
# addresses, localhost, this machine's hostname and names ending in
# .localhost, .local, .internal or .home.arpa always work; requests naming
# any other host get 403 Forbidden, which stops web pages from reaching the
# proxy and the server through DNS rebinding. List other names clients use
# here, without port (default: none). "*.example" allows all names under
# example, e.g. "*.lan" for a router's .lan names; "*" allows any host and
# turns the check off.
# allowed_hosts:
#   - "llm.example.com"
#   - "*.lan"

# Metrics settings
metrics:
  # Number of recent queries to average tokens/sec over (default: 10)
  history_points: 10

# Logging settings
logging:
  # Print [DEBUG] lines: effective config, backend probe, and per request the
  # upstream status, Content-Type, parser used and how metrics were derived.
  debug: false
